# No server.port needed - service doesn't expose REST endpoints
# Management port for health checks only
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0

spring:
  application:
    name: notifications-service
  zipkin:
    base-url: http://zipkin:9411
  
  # Database configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/bank_app_db
    username: bank_app_user
    password: bank_app_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: notifications_schema
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  
  # Kafka consumer configuration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notifications-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      enable-auto-commit: false  # Manual commit for "at least once"
      auto-offset-reset: earliest  # Start from beginning if no offset
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
    listener:
      ack-mode: manual  # Manual acknowledgment
      concurrency: 3  # Number of consumer threads

logging:
  time-zone: Europe/Moscow
  level:
    root: INFO
    io.github.danjos.mybankapp.notifications: DEBUG
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
