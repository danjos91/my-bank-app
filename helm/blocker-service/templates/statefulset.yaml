apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "blocker-service.fullname" . }}-db
  labels:
    {{- include "blocker-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ include "blocker-service.fullname" . }}-db
  replicas: 1
  selector:
    matchLabels:
      {{- include "blocker-service.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        {{- include "blocker-service.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: {{ .Values.db.image }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: {{ .Values.db.username }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "blocker-service.fullname" . }}-db-secret
                  key: password
            - name: POSTGRES_DB
              value: {{ .Values.db.database }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            {{- toYaml .Values.db.resources | nindent 12 }}
      volumes:
        - name: init-scripts
          configMap:
            name: {{ include "blocker-service.fullname" . }}-db-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.db.persistence.size }}

