apiVersion: v1
kind: Service
metadata:
  name: {{ include "elasticsearch-simple.fullname" . }}
  labels:
    {{- include "elasticsearch-simple.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "elasticsearch-simple.selectorLabels" . | nindent 4 }}
---
{{- if .Values.kibana.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "elasticsearch-simple.fullname" . }}-kibana
  labels:
    {{- include "elasticsearch-simple.labels" . | nindent 4 }}
    app.kubernetes.io/component: kibana
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 5601
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "elasticsearch-simple.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: kibana
{{- end }}

