apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elasticsearch-simple.fullname" . }}
  labels:
    {{- include "elasticsearch-simple.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "elasticsearch-simple.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "elasticsearch-simple.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: elasticsearch
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: discovery.type
              value: "single-node"
            - name: xpack.security.enabled
              value: "false"
            - name: xpack.security.enrollment.enabled
              value: "false"
            - name: "ES_JAVA_OPTS"
              value: "-Xms256m -Xmx512m"
            - name: xpack.monitoring.collection.enabled
              value: "true"
          ports:
            - name: http
              containerPort: 9200
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: data
          emptyDir: {}
---
{{- if .Values.kibana.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elasticsearch-simple.fullname" . }}-kibana
  labels:
    {{- include "elasticsearch-simple.labels" . | nindent 4 }}
    app.kubernetes.io/component: kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "elasticsearch-simple.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: kibana
  template:
    metadata:
      labels:
        {{- include "elasticsearch-simple.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: kibana
    spec:
      containers:
        - name: kibana
          image: "{{ .Values.kibana.image.repository }}:{{ .Values.kibana.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ELASTICSEARCH_HOSTS
              value: "http://{{ include "elasticsearch-simple.fullname" . }}:9200"
            - name: ELASTICSEARCH_SERVICEACCOUNTTOKEN
              value: ""
            - name: ELASTICSEARCH_SERVICEACCOUNTTOKEN_CREDENTIALS
              value: ""
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_NAME
              value: "kibana"
            - name: ELASTICSEARCH_USERNAME
              value: ""
            - name: ELASTICSEARCH_PASSWORD
              value: ""
            - name: XPACK_SECURITY_ENABLED
              value: "false"
            - name: XPACK_MONITORING_ENABLED
              value: "false"
            - name: XPACK_APM_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 5601
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 180
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          resources:
            {{- toYaml .Values.kibana.resources | nindent 12 }}
{{- end }}

