apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "exchange-generator-service.fullname" . }}-test-connection"
  labels:
    {{- include "exchange-generator-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['-qO-', 'http://{{ include "exchange-generator-service.fullname" . }}:{{ .Values.service.port }}/actuator/health']
  restartPolicy: Never

