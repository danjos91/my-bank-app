# Default values for my-bank-app umbrella chart.
# This file allows you to override values for subcharts.

global:
  env: dev
  image:
    pullPolicy: Never

accounts-service:
  replicaCount: 1

auth-server:
  replicaCount: 1
  image:
    tag: "fixed"

blocker-service:
  replicaCount: 1

cash-service:
  replicaCount: 1

exchange-generator-service:
  replicaCount: 1
  image:
    tag: "fixed"

exchange-service:
  replicaCount: 1

front-ui:
  replicaCount: 1
  image:
    tag: "fixed"
  ingress:
    enabled: true
    hosts:
      - host: bank.local
        paths:
          - path: /
            pathType: Prefix
  db:
    host: my-bank-app-accounts-service-db
  auth:
    serverUrl: http://my-bank-app-auth-server:8085

notifications-service:
  replicaCount: 1
