apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "front-ui.fullname" . }}
  labels:
    {{- include "front-ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "front-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "front-ui.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: {{ .Values.global.metrics.prometheusPath | default "/actuator/prometheus" | quote }}
        prometheus.io/port: {{ .Values.service.port | quote }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Values.db.host }}:{{ .Values.db.port }}/{{ .Values.db.database }}"
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.db.username }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: password
            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_BANK_APP_AUTHORIZATION_URI
              value: {{ .Values.auth.serverUrl }}/oauth2/authorize
            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_BANK_APP_TOKEN_URI
              value: {{ .Values.auth.serverUrl }}/auth/token

            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_BANK_APP_USER_INFO_URI
              value: {{ .Values.auth.serverUrl }}/userinfo
            - name: GATEWAY_URL
              value: {{ .Values.env.gatewayUrl | default "http://gateway" }}
            - name: SERVICES_ACCOUNTS_URL
              value: {{ .Values.services.accounts | default "http://my-bank-app-accounts-service:8081" }}
            - name: SERVICES_CASH_URL
              value: {{ .Values.services.cash | default "http://my-bank-app-cash-service:8082" }}
            - name: SERVICES_TRANSFER_URL
              value: {{ .Values.services.transfer | default "http://my-bank-app-transfer-service:8083" }}
            - name: SERVICES_EXCHANGE_URL
              value: {{ .Values.services.exchange | default "http://my-bank-app-exchange-service:8087" }}
            - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
              value: {{ .Values.global.tracing.zipkinEndpoint | default "http://zipkin.observability.svc.cluster.local:9411/api/v2/spans" | quote }}
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "1.0"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,metrics,prometheus"
            - name: LOGS_BOOTSTRAP_SERVERS
              value: {{ .Values.global.logging.bootstrapServers | default "kafka.kafka.svc.cluster.local:9092" | quote }}
            - name: LOGS_TOPIC
              value: {{ .Values.global.logging.topic | default "service-logs" | quote }}
            - name: MANAGEMENT_METRICS_TAGS_APPLICATION
              value: {{ .Chart.Name | quote }}
            - name: MANAGEMENT_METRICS_TAGS_ENVIRONMENT
              value: {{ .Values.global.env | default "dev" | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
