global:
  env: dev

replicaCount: 1

image:
  repository: front-ui
  pullPolicy: Never
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8086

ingress:
  enabled: true
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: bank-app.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

auth:
  serverUrl: http://my-bank-app-auth-server:8085

# Internal service URLs (used by BankService)
services:
  accounts: http://my-bank-app-accounts-service:8081
  cash: http://my-bank-app-cash-service:8082
  transfer: http://my-bank-app-transfer-service:8083
  exchange: http://my-bank-app-exchange-service:8087

# DB config for session or small data (Front UI connects to DB in code but usually for session/user data?)
# Based on application.yml it connects to DB. Assuming shared accounts DB or its own.
# application.yml shows: url: jdbc:postgresql://localhost:5432/bank_app_db
# It seems front-ui connects to the SAME DB as accounts/auth or a main DB.
# Let's point it to accounts-service-db to be safe as it shares user data.
db:
  host: accounts-service-db
  port: 5432
  username: bank_app_user
  database: bank_app_db
  secretName: my-bank-app-accounts-service-db-secret

observability:
  enabled: true
  zipkinUrl: http://zipkin.observability.svc.cluster.local:9411
