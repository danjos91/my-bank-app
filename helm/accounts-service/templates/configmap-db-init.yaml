apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "accounts-service.fullname" . }}-db-init
  labels:
    {{- include "accounts-service.labels" . | nindent 4 }}
data:
  init.sql: |
    -- Accounts Service Database Schema
    CREATE SCHEMA IF NOT EXISTS accounts_schema;
    SET search_path TO accounts_schema;

    CREATE TABLE IF NOT EXISTS users (
        id BIGSERIAL PRIMARY KEY,
        username VARCHAR(50) UNIQUE NOT NULL,
        password VARCHAR(255) NOT NULL,
        first_name VARCHAR(100) NOT NULL,
        last_name VARCHAR(100) NOT NULL,
        email VARCHAR(100),
        birth_date DATE NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        CONSTRAINT users_age_check CHECK (birth_date <= CURRENT_DATE - INTERVAL '18 years'),
        CONSTRAINT users_email_format CHECK (email IS NULL OR email ~* '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$')
    );

    CREATE TABLE IF NOT EXISTS accounts (
        id BIGSERIAL PRIMARY KEY,
        user_id BIGINT NOT NULL REFERENCES users(id) ON DELETE CASCADE,
        currency VARCHAR(3) DEFAULT 'RUB' NOT NULL,
        balance DECIMAL(19,2) DEFAULT 0.00 NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        CONSTRAINT accounts_balance_non_negative CHECK (balance >= 0),
        CONSTRAINT accounts_currency_check CHECK (currency IN ('RUB', 'USD', 'CNY')),
        CONSTRAINT accounts_user_currency_unique UNIQUE (user_id, currency)
    );

    CREATE INDEX IF NOT EXISTS idx_users_email ON users(email);
    CREATE INDEX IF NOT EXISTS idx_accounts_user_id ON accounts(user_id);
    CREATE INDEX IF NOT EXISTS idx_accounts_currency ON accounts(currency);

    CREATE OR REPLACE FUNCTION update_updated_at_column()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = CURRENT_TIMESTAMP;
        RETURN NEW;
    END;
    $$ language 'plpgsql';

    DROP TRIGGER IF EXISTS update_users_updated_at ON users;
    CREATE TRIGGER update_users_updated_at 
        BEFORE UPDATE ON users 
        FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();

    DROP TRIGGER IF EXISTS update_accounts_updated_at ON accounts;
    CREATE TRIGGER update_accounts_updated_at 
        BEFORE UPDATE ON accounts 
        FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();

    INSERT INTO users (username, password, first_name, last_name, email, birth_date) 
    VALUES ('admin', '$2a$10$mbDSFQBj5HbrA0XyS0WhXe6GQt86B2JHip4eLUMJvmIpbUqZx5Nuy', 'Admin', 'User', 'admin@bank.com', '1990-01-01')
    ON CONFLICT (username) DO NOTHING;

    INSERT INTO accounts (user_id, currency, balance) 
    SELECT id, 'RUB', 200000.00 FROM users WHERE username = 'admin'
    ON CONFLICT (user_id, currency) DO NOTHING;

