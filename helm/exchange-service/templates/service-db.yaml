apiVersion: v1
kind: Service
metadata:
  name: {{ include "exchange-service.fullname" . }}-db
  labels:
    {{- include "exchange-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  ports:
    - port: {{ .Values.db.port }}
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "exchange-service.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
  clusterIP: None

