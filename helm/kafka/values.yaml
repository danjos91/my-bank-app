  - name: exchange-rates
    partitions: 3
    replicationFactor: 1
    config:
      retention.ms: 604800000
      min.insync.replicas: 1

## Production values override
## For production deployment, use:
## helm install kafka bitnami/kafka -f values.yaml -f values-prod.yaml

