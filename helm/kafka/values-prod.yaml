# Production Kafka Configuration
# Override development values for production deployment
# Usage: helm install kafka bitnami/kafka -f values.yaml -f values-prod.yaml

kafka:
  # Production: 3 brokers for high availability
  replicaCount: 3
  
  controller:
    replicaCount: 3
  
  # Production configuration
  config:
    autoCreateTopicsEnable: false
    deleteTopicEnable: false  # Prevent accidental topic deletion
    defaultReplicationFactor: 3
    offsetsTopicReplicationFactor: 3
    transactionStateLogReplicationFactor: 3
    minInsyncReplicas: 2  # At least 2 replicas must acknowledge
    numPartitions: 6
    
    # Extended retention for production
    logRetentionHours: 168  # 7 days
    logRetentionBytes: -1
    
  # Production persistence
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""  # Use your cloud provider's storage class
  
  # Production resources
  resources:
    requests:
      memory: 2Gi
      cpu: 1000m
    limits:
      memory: 4Gi
      cpu: 2000m

# Production topics with higher replication
topics:
  - name: account-created
    partitions: 6
    replicationFactor: 3
    config:
      retention.ms: 604800000
      min.insync.replicas: 2
  
  - name: account-updated
    partitions: 6
    replicationFactor: 3
    config:
      retention.ms: 604800000
      min.insync.replicas: 2
  
  - name: deposit-completed
    partitions: 6
    replicationFactor: 3
    config:
      retention.ms: 604800000
      min.insync.replicas: 2
  
  - name: withdrawal-completed
    partitions: 6
    replicationFactor: 3
    config:
      retention.ms: 604800000
      min.insync.replicas: 2
  
  - name: transfer-initiated
    partitions: 6
    replicationFactor: 3
    config:
      retention.ms: 604800000
      min.insync.replicas: 2
  
  - name: transfer-completed
    partitions: 6
    replicationFactor: 3
    config:
      retention.ms: 604800000
      min.insync.replicas: 2
  
  - name: transfer-failed
    partitions: 6
    replicationFactor: 3
    config:
      retention.ms: 604800000
      min.insync.replicas: 2
  
  - name: notification-event
    partitions: 6
    replicationFactor: 3
    config:
      retention.ms: 604800000
      min.insync.replicas: 2

  - name: exchange-rates
    partitions: 6
    replicationFactor: 3
    config:
      retention.ms: 604800000
      min.insync.replicas: 2

