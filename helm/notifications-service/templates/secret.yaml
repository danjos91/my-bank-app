apiVersion: v1
kind: Secret
metadata:
  name: {{ include "notifications-service.fullname" . }}-db-secret
  labels:
    {{- include "notifications-service.labels" . | nindent 4 }}
type: Opaque
data:
  # Password is base64-encoded from values.yaml
  # Override with: --set db.password=your_password
  # Or use external secrets operator for production
  password: {{ .Values.db.password | b64enc | quote }}
