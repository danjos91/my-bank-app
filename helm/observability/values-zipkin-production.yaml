# Production конфигурация Zipkin с увеличенной памятью
# Использование: helm upgrade --install zipkin ... -f helm/observability/values-zipkin-production.yaml

global:
  security:
    allowInsecureImages: true
tls:
  enabled: false
  password: changeme
  autoGenerated:
    enabled: true

image:
  registry: docker.io
  repository: bitnamilegacy/zipkin
  tag: 3.5.1-debian-12-r5
  pullPolicy: IfNotPresent

service:
  type: ClusterIP

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/actuator/prometheus"
  prometheus.io/port: "9411"

defaultInitContainers:
  waitForCassandra:
    enabled: false
    image:
      registry: docker.io
      repository: bitnamilegacy/cassandra
      tag: 5.0.4-debian-12-r6
      pullPolicy: IfNotPresent

# Снижаем sample rate для production (10% вместо 100%)
# Это значительно уменьшит нагрузку на память
collector:
  sampleRate: 0.1

cassandra:
  enabled: false
  dbUser:
    user: bn_zipkin
    password: zipkinpass
    existingSecret: ""
  keyspace: bn_zipkin
  image:
    registry: docker.io
    repository: bitnamilegacy/cassandra
    tag: 5.0.4-debian-12-r6
    pullPolicy: IfNotPresent

# ВАЖНО: mem storage всё ещё используется, но с увеличенной памятью
# Для полной персистентности используйте values-zipkin-elasticsearch.yaml
storageType: mem

# Увеличенные ресурсы для production
resources:
  limits:
    cpu: 1000m      # Увеличено с 500m
    memory: 2Gi     # Увеличено с 512Mi (в 4 раза!)
  requests:
    cpu: 500m       # Увеличено с 200m
    memory: 1Gi     # Увеличено с 256Mi (в 4 раза!)

# Увеличенные таймауты для проб, так как Zipkin может медленно отвечать
livenessProbe:
  enabled: true
  initialDelaySeconds: 120  # Увеличено с 60
  periodSeconds: 30          # Увеличено с 15
  timeoutSeconds: 20         # Увеличено с 10
  failureThreshold: 5       # Уменьшено с 8 (быстрее перезапуск при реальных проблемах)

readinessProbe:
  enabled: true
  initialDelaySeconds: 120   # Увеличено с 60
  periodSeconds: 20          # Увеличено с 10
  timeoutSeconds: 20         # Увеличено с 10
  failureThreshold: 5        # Уменьшено с 8

# Примечание: JVM настройки можно передать через extraEnvVars, если поддерживается чартом
# Для версии 1.3.11 может потребоваться другой способ передачи переменных окружения
# extraEnvVars:
#   - name: JAVA_OPTS
#     value: "-Xmx1536m -Xms1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"

