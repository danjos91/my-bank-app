# Production конфигурация Zipkin с Elasticsearch для персистентного хранения
# Это решает проблему потери трейсов при перезапуске и ограничений памяти
# Использование: helm upgrade --install zipkin ... -f helm/observability/values-zipkin-elasticsearch.yaml
#
# ПРЕДВАРИТЕЛЬНО: Убедитесь, что Elasticsearch развёрнут в namespace observability
# Проверка: kubectl get svc -n observability elasticsearch

global:
  security:
    allowInsecureImages: true
tls:
  enabled: false
  password: changeme
  autoGenerated:
    enabled: true

image:
  registry: docker.io
  repository: bitnamilegacy/zipkin
  tag: 3.5.1-debian-12-r5
  pullPolicy: IfNotPresent

service:
  type: ClusterIP

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/actuator/prometheus"
  prometheus.io/port: "9411"

defaultInitContainers:
  waitForCassandra:
    enabled: false

# Sample rate для production
collector:
  sampleRate: 0.1

cassandra:
  enabled: false

# ИСПОЛЬЗОВАНИЕ ELASTICSEARCH ДЛЯ ПЕРСИСТЕНТНОГО ХРАНИЛИЩА
# Это решает проблему потери трейсов и ограничений памяти
storageType: elasticsearch

# Конфигурация Elasticsearch
# Адаптируйте под вашу конфигурацию Elasticsearch
elasticsearch:
  hosts: http://elasticsearch.observability.svc.cluster.local:9200
  # Если Elasticsearch требует аутентификацию:
  # username: elastic
  # password: <password>
  # Или используйте existingSecret
  index: zipkin
  dateSeparator: "-"  # Создаёт индексы по дням: zipkin-2024-12-20
  indexShards: 5
  indexReplicas: 1
  # TTL для автоматической очистки старых трейсов (7 дней)
  # Настраивается через Elasticsearch index lifecycle management

# Ресурсы могут быть меньше, так как трейсы хранятся в Elasticsearch
resources:
  limits:
    cpu: 1000m
    memory: 1Gi      # Меньше, чем с mem storage, так как данные в ES
  requests:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 8

readinessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 8

# JVM настройки
extraEnvVars:
  - name: JAVA_OPTS
    value: "-Xmx768m -Xms512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
  # Переменные для Elasticsearch storage
  - name: STORAGE_TYPE
    value: "elasticsearch"
  - name: ES_HOSTS
    value: "http://elasticsearch.observability.svc.cluster.local:9200"
  - name: ES_INDEX
    value: "zipkin"
  - name: ES_DATE_SEPARATOR
    value: "-"

