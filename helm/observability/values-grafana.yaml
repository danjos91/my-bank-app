admin:
  user: admin
  password: admin123

service:
  type: ClusterIP

datasources:
  secretDefinition: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.observability.svc.cluster.local
        isDefault: true
      - name: Elasticsearch
        type: elasticsearch
        url: http://elasticsearch-master.observability.svc.cluster.local:9200
        access: proxy
        jsonData:
          esVersion: 8
          timeField: "@timestamp"

dashboardsProvider:
  enabled: true
  configMaps:
    - grafana-dashboards

extraDeploy:
  - |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: grafana-dashboards
      labels:
        grafana_dashboard: "1"
    data:
      spring-boot.json: |-
        {
          "id": null,
          "uid": "spring-boot-app",
          "title": "Spring Boot Overview",
          "schemaVersion": 39,
          "version": 1,
          "panels": [
            {
              "type": "graph",
              "title": "HTTP 5xx rate",
              "targets": [
                {
                  "expr": "rate(http_server_requests_seconds_count{status=~\\\"5..\\\"}[5m])",
                  "legendFormat": "5xx rate",
                  "datasource": "Prometheus"
                }
              ],
              "lines": true,
              "linewidth": 2,
              "nullPointMode": "null as zero",
              "fill": 1
            },
            {
              "type": "graph",
              "title": "HTTP p95 latency (s)",
              "targets": [
                {
                  "expr": "histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m]))",
                  "legendFormat": "p95",
                  "datasource": "Prometheus"
                }
              ],
              "lines": true,
              "linewidth": 2,
              "nullPointMode": "null as zero",
              "fill": 1
            },
            {
              "type": "stat",
              "title": "Active requests",
              "targets": [
                {
                  "expr": "sum(http_server_requests_seconds_active_count)",
                  "datasource": "Prometheus"
                }
              ]
            }
          ]
        }
      jvm.json: |-
        {
          "id": null,
          "uid": "jvm-metrics",
          "title": "JVM Metrics",
          "schemaVersion": 39,
          "version": 1,
          "panels": [
            {
              "type": "graph",
              "title": "Heap usage",
              "targets": [
                {
                  "expr": "jvm_memory_used_bytes{area=\\\"heap\\\"}",
                  "legendFormat": "used",
                  "datasource": "Prometheus"
                },
                {
                  "expr": "jvm_memory_max_bytes{area=\\\"heap\\\"}",
                  "legendFormat": "max",
                  "datasource": "Prometheus"
                }
              ],
              "lines": true
            },
            {
              "type": "graph",
              "title": "GC pause p95 (s)",
              "targets": [
                {
                  "expr": "histogram_quantile(0.95, rate(jvm_gc_pause_seconds_bucket[5m]))",
                  "legendFormat": "p95",
                  "datasource": "Prometheus"
                }
              ],
              "lines": true
            },
            {
              "type": "stat",
              "title": "Threads live",
              "targets": [
                {
                  "expr": "jvm_threads_live_threads",
                  "datasource": "Prometheus"
                }
              ]
            }
          ]
        }
      business-metrics.json: |-
        {
          "id": null,
          "uid": "business-metrics",
          "title": "Business Metrics",
          "schemaVersion": 39,
          "version": 1,
          "panels": [
            {
              "type": "graph",
              "title": "Login Success/Failure Rate",
              "targets": [
                {
                  "expr": "rate(auth_login_success_total[5m])",
                  "legendFormat": "Success",
                  "datasource": "Prometheus"
                },
                {
                  "expr": "sum(rate(auth_login_failed_total[5m])) by (reason)",
                  "legendFormat": "Failed - {{reason}}",
                  "datasource": "Prometheus"
                }
              ],
              "lines": true,
              "linewidth": 2,
              "fill": 1
            },
            {
              "type": "graph",
              "title": "Transfer Volume by Currency",
              "targets": [
                {
                  "expr": "sum(transfer_amount_sum) by (currency)",
                  "legendFormat": "{{currency}}",
                  "datasource": "Prometheus"
                }
              ],
              "lines": true,
              "linewidth": 2,
              "fill": 1
            },
            {
              "type": "graph",
              "title": "Blocked Operations Over Time",
              "targets": [
                {
                  "expr": "rate(blocker_operations_blocked_total[5m])",
                  "legendFormat": "Blocked",
                  "datasource": "Prometheus"
                },
                {
                  "expr": "rate(blocker_operations_approved_total[5m])",
                  "legendFormat": "Approved",
                  "datasource": "Prometheus"
                }
              ],
              "lines": true,
              "linewidth": 2,
              "fill": 1
            },
            {
              "type": "stat",
              "title": "Total Transfers",
              "targets": [
                {
                  "expr": "transfer_total_total",
                  "datasource": "Prometheus"
                }
              ]
            },
            {
              "type": "stat",
              "title": "Failed Transfers",
              "targets": [
                {
                  "expr": "sum(transfer_failed_total)",
                  "datasource": "Prometheus"
                }
              ]
            },
            {
              "type": "stat",
              "title": "Suspicious Operations",
              "targets": [
                {
                  "expr": "transfer_suspicious_total",
                  "datasource": "Prometheus"
                }
              ]
            },
            {
              "type": "graph",
              "title": "Exchange Rate Update Health",
              "targets": [
                {
                  "expr": "rate(exchange_rate_updates_total[5m])",
                  "legendFormat": "Updates",
                  "datasource": "Prometheus"
                },
                {
                  "expr": "rate(exchange_rate_missing_total[5m])",
                  "legendFormat": "Missing",
                  "datasource": "Prometheus"
                },
                {
                  "expr": "rate(exchange_rate_invalid_total[5m])",
                  "legendFormat": "Invalid",
                  "datasource": "Prometheus"
                }
              ],
              "lines": true,
              "linewidth": 2,
              "fill": 1
            },
            {
              "type": "stat",
              "title": "Currency Availability (USD)",
              "targets": [
                {
                  "expr": "exchange_currency_available{currency=\\\"USD\\\"}",
                  "datasource": "Prometheus"
                }
              ]
            },
            {
              "type": "stat",
              "title": "Currency Availability (CNY)",
              "targets": [
                {
                  "expr": "exchange_currency_available{currency=\\\"CNY\\\"}",
                  "datasource": "Prometheus"
                }
              ]
            }
          ]
        }

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi


