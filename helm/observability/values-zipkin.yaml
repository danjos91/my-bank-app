global:
  security:
    allowInsecureImages: true
tls:
  enabled: false
  password: changeme
  autoGenerated:
    enabled: true

image:
  registry: docker.io
  repository: bitnamilegacy/zipkin
  tag: 3.5.1-debian-12-r5
  pullPolicy: IfNotPresent

service:
  type: ClusterIP

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/actuator/prometheus"
  prometheus.io/port: "9411"

defaultInitContainers:
  waitForCassandra:
    enabled: false
    image:
      registry: docker.io
      repository: bitnamilegacy/cassandra
      tag: 5.0.4-debian-12-r6
      pullPolicy: IfNotPresent

collector:
  sampleRate: 1.0

cassandra:
  enabled: false
  dbUser:
    user: bn_zipkin
    password: zipkinpass
    existingSecret: ""
  keyspace: bn_zipkin
  image:
    registry: docker.io
    repository: bitnamilegacy/cassandra
    tag: 5.0.4-debian-12-r6
    pullPolicy: IfNotPresent

storageType: mem

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

livenessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 8

readinessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 8
