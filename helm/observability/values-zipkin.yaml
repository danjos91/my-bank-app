global:
  security:
    allowInsecureImages: true
tls:
  enabled: false
  password: changeme
  autoGenerated:
    enabled: true

image:
  registry: docker.io
  repository: bitnamilegacy/zipkin
  tag: 3.5.1-debian-12-r5
  pullPolicy: IfNotPresent

service:
  type: ClusterIP

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/actuator/prometheus"
  prometheus.io/port: "9411"

defaultInitContainers:
  waitForCassandra:
    enabled: false
    image:
      registry: docker.io
      repository: bitnamilegacy/cassandra
      tag: 5.0.4-debian-12-r6
      pullPolicy: IfNotPresent

# Sample rate: 1.0 = 100% трейсов (для dev/test)
# Для production рекомендуется 0.1 (10%) или 0.01 (1%)
collector:
  sampleRate: 1.0

cassandra:
  enabled: false
  dbUser:
    user: bn_zipkin
    password: zipkinpass
    existingSecret: ""
  keyspace: bn_zipkin
  image:
    registry: docker.io
    repository: bitnamilegacy/cassandra
    tag: 5.0.4-debian-12-r6
    pullPolicy: IfNotPresent

# ВАЖНО: mem storage хранит трейсы только в памяти
# При перезапуске пода все трейсы теряются
# Для production рекомендуется использовать Elasticsearch (см. values-zipkin-elasticsearch.yaml)
storageType: mem

# ВАЖНО: При storageType=mem и sampleRate=1.0 память может быстро заполняться
# Если Zipkin недоступен, увеличьте memory limit или используйте production конфигурацию
resources:
  limits:
    cpu: 500m
    memory: 512Mi  # Может быть недостаточно при высокой нагрузке
  requests:
    cpu: 200m
    memory: 256Mi

# Пробы могут не проходить сразу из-за медленного старта Zipkin
# Увеличенные таймауты помогают избежать ложных срабатываний
livenessProbe:
  enabled: true
  initialDelaySeconds: 120  # Увеличено для медленного старта
  periodSeconds: 30
  timeoutSeconds: 20
  failureThreshold: 5

readinessProbe:
  enabled: true
  initialDelaySeconds: 120  # Увеличено для медленного старта
  periodSeconds: 20
  timeoutSeconds: 20
  failureThreshold: 5
