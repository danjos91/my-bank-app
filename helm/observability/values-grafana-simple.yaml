# Minimal Grafana configuration compatible with chart v12.x
admin:
  user: admin
  password: admin123

service:
  type: ClusterIP

# Configure Prometheus datasource
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.observability.svc.cluster.local
        isDefault: true
        editable: true

# Don't auto-provision dashboards - users will import manually via UI
dashboardProviders: {}

dashboards: {}

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

persistence:
  enabled: false
