# Minimal Grafana configuration compatible with chart v12.x
global:
  security:
    allowInsecureImages: true

admin:
  user: admin
  password: admin123

image:
  registry: docker.io
  repository: bitnamilegacy/grafana
  tag: 12.1.1-debian-12-r1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP

# Configure Prometheus datasource
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.observability.svc.cluster.local:80
        isDefault: true
        editable: true

# Configure dashboard provisioning
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards

# Mount dashboard via ConfigMap
# The ConfigMap should be created using: kubectl create configmap grafana-spring-boot-dashboard --from-file=spring-boot.json=helm/observability/dashboards/spring-boot.json -n observability
extraVolumes:
  - name: dashboards
    configMap:
      name: grafana-spring-boot-dashboard

extraVolumeMounts:
  - name: dashboards
    mountPath: /var/lib/grafana/dashboards
    readOnly: true

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

persistence:
  enabled: false
