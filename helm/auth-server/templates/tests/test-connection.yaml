apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "auth-server.fullname" . }}-test-connection"
  labels:
    {{- include "auth-server.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['-qO-', 'http://{{ include "auth-server.fullname" . }}:{{ .Values.service.port }}/actuator/health']
  restartPolicy: Never

