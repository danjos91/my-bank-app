spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/bank_app_db
    username: bank_app_user
    password: bank_app_password
  data:
    redis:
      host: redis
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://my-bank-app-auth-server:8085

services:
  accounts:
    url: http://my-bank-app-accounts-service:8081
  blocker:
    url: http://my-bank-app-blocker-service:8089
  notifications:
    url: http://my-bank-app-notifications-service:8084
