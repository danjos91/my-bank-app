# Docker-specific configuration (overrides common application.yml)
spring:
  cloud:
    config:
      uri: http://config-server:8888
      enabled: true
      fail-fast: true
  datasource:
    url: jdbc:postgresql://postgres:5432/bank_app_db
    username: bank_app_user
    password: bank_app_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true
  data:
    redis:
      host: redis
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth-server:8085

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

