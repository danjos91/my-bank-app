# Cash Service specific configuration
spring:
  jpa:
    properties:
      hibernate:
        default_schema: cash_schema
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth-server:8085

# Cash service specific settings
cash:
  service:
    name: cash-service
    port: 8082
  database:
    schema: cash_schema
  security:
    jwt:
      audience: cash-service
      scope: read,write
  resilience4j:
    circuit-breaker:
      failure-rate-threshold: 50
      wait-duration-in-open-state: 30s
      sliding-window-size: 10
    retry:
      max-attempts: 3
      wait-duration: 1s

# Service URLs for inter-service communication
services:
  accounts:
    url: http://accounts-service:8081
  notifications:
    url: http://notifications-service:8084

logging:
  time-zone: Europe/Moscow