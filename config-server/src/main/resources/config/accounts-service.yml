# Accounts Service specific configuration
spring:
  jpa:
    properties:
      hibernate:
        default_schema: accounts_schema
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth-server:8085

# Accounts service specific settings
accounts:
  service:
    name: accounts-service
    port: 8081
  database:
    schema: accounts_schema
  security:
    jwt:
      audience: accounts-service
      scope: read,write

logging:
  time-zone: Europe/Moscow