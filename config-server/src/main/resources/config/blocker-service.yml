# Blocker Service specific configuration
spring:
  jpa:
    properties:
      hibernate:
        default_schema: blocker_schema
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth-server:8085

# Blocker service specific settings
blocker:
  service:
    name: blocker-service
    port: 8089
  database:
    schema: blocker_schema
  security:
    jwt:
      audience: blocker-service
      scope: read,write
  threshold:
    amount: 10000
    currency: RUB
  resilience4j:
    circuit-breaker:
      failure-rate-threshold: 50
      wait-duration-in-open-state: 30s
      sliding-window-size: 10
    retry:
      max-attempts: 3
      wait-duration: 1s

logging:
  time-zone: Europe/Moscow

