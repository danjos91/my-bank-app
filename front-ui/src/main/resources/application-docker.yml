server:
  port: 8086

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/bank_app_db
    username: bank_app_user
    password: bank_app_password
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      client:
        provider:
          bank-app:
            authorization-uri: http://my-bank-app-auth-server:8085/oauth2/authorize
            token-uri: http://my-bank-app-auth-server:8085/auth/token
            user-info-uri: http://my-bank-app-auth-server:8085/userinfo

gateway:
  # Using accounts service directly (legacy code reads gateway.url for service calls)
  url: http://my-bank-app-accounts-service:8081

# Internal service endpoints used by BankService
services:
  accounts:
    url: http://my-bank-app-accounts-service:8081
  cash:
    url: http://my-bank-app-cash-service:8082
  transfer:
    url: http://my-bank-app-transfer-service:8083
  exchange:
    url: http://my-bank-app-exchange-service:8087
