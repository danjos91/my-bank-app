spring:
  config:
    import: configserver:http://config-server:8888
  cloud:
    config:
      uri: http://config-server:8888
  security:
    oauth2:
      client:
        provider:
          bank-app:
            authorization-uri: http://auth-server:8085/oauth2/authorize
            token-uri: http://auth-server:8085/oauth2/token
            user-info-uri: http://auth-server:8085/userinfo

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

gateway:
  url: http://gateway:8080

