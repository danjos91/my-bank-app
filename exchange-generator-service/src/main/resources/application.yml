server:
  port: 8088

spring:
  application:
    name: exchange-generator-service
  cloud:
    config:
      enabled: true
      fail-fast: true

services:
  exchange:
    url: http://localhost:8087

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  time-zone: Europe/Moscow
  level:
    org.springframework.web: DEBUG
    io.github.danjos.mybankapp.exchangegenerator: DEBUG

